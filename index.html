<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) reports real values on
         notched phones. maximum-scale/user-scalable are kept for the engines
         that still honour them, but iOS Safari has ignored them since iOS 10 —
         the `touch-action: none` below is what actually stops pinch-zoom, along
         with the gesture handlers in src/core/Input.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Ra Drag Racing v2</title>

    <!-- Add to Home Screen, which on a phone is worth more than it sounds.
         Safari's toolbar and tab strip occupy roughly the top 220px of a
         landscape phone — about a quarter of the vertical space, in a game that
         is already short of height and whose menus had to be rebuilt to fit
         what was left. Launched from the home screen these tags drop the chrome
         entirely and the game gets the whole panel.

         `black-translucent` puts the status bar over the canvas rather than
         above it, which is what we want given `viewport-fit=cover` and the
         `env(safe-area-inset-*)` padding already in the HUD and menu CSS.

         The deprecated apple-prefixed name is kept alongside the standard one:
         iOS honours the former and nothing else reads it, while the standard
         `mobile-web-app-capable` is what every other engine looks for. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ra Drag Racing v2" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="A kart racer with no art assets — every texture, mesh and sound generated in code." />
    <!-- No `apple-touch-icon`, deliberately. An icon would be the first and only
         art asset in the repository, and iOS falls back to a snapshot of the
         page, which is a procedurally generated image of the game — exactly the
         right icon for this project and one that costs nothing. -->
    <!-- RA DRAG: an empty data-URI favicon for the same reason — browsers ask
         for /favicon.ico on every load, and a 404 in the console reads as a
         broken game to anyone watching it. This is not an asset. -->
    <link rel="icon" href="data:," />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #05070d;
        /* the page is a game surface, not a document: no panning, no pinch,
           no double-tap zoom, no pull-to-refresh, no long-press callout */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;

  <style>
/* RA TOD boot splash (v2, Sega style) — Ra's own load screen.
   Styles extracted verbatim from the splash package; the pulse
   keyframes are supplied here (the extraction's CSS referenced
   them but the wrapper kept them in a different style block). */
#stage { position: fixed; inset: 0; z-index: 50; cursor: pointer; background: #000; transition: opacity 0.6s ease; }

  #stage.fade { opacity: 0; }


  #prompt {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #8fa3c8; font-size: clamp(18px, 3.5vw, 30px); letter-spacing: 0.35em;
    animation: pulse 1.6s ease-in-out infinite; text-align: center;
  }


  #logoWrap {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
  }

  #logoBox { position: relative; display: inline-block; }

  #logo, #shine {
    font-size: clamp(64px, 17vw, 220px); font-weight: 900; letter-spacing: 0.04em;
    line-height: 1; white-space: nowrap;
  }

  #logo { position: relative; }

  /* chrome letters start fully hidden — the light reveals each one */
  #logo .ch {
    display: inline-block;
    background: linear-gradient(180deg,
      #ffffff 0%, #dfe9f7 22%, #9fb7d9 42%,
      #2f66c9 50%, #0a2a6e 54%, #4a7de0 78%, #cfe0fb 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.2, 1.6, 0.4, 1);
  }

  #logo .ch.lit {
    opacity: 1;
    transform: scale(1);
    filter: brightness(1.12) saturate(1.15);
    text-shadow: 0 0 34px rgba(120,170,255,0.55), 0 0 90px rgba(70,120,255,0.30);
  }

  #logo .sp, #shine .sp { display: inline-block; width: 0.28em; }


  /* white-hot copy of the word; a moving mask band makes the beam
     visible ONLY on the letter shapes, never on the background */
  #shine {
    position: absolute; left: 0; top: 0; pointer-events: none;
    color: #ffffff;
    text-shadow: 0 0 16px #ffffff, 0 0 46px #9fc0ff, 0 0 95px #5a8cff;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 0%, transparent 0%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 0%, transparent 0%);
  }

  #shine .sch { display: inline-block; }


  /* glow pulse on the whole word while the chant sings */
  #logoBox.chanting { animation: chantPulse 1.6s ease-in-out; }


  #floorGlow {
    position: absolute; left: 50%; top: 60%; width: 62%; height: 22%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(90,150,255,0.32) 0%, rgba(90,150,255,0.10) 45%, rgba(90,150,255,0) 72%);
    opacity: 0; transition: opacity 1.4s ease; pointer-events: none;
    filter: blur(4px);
  }

  #floorGlow.on { opacity: 1; }


  /* only shown if this viewer blocks sound — tells the user how to hear it */
  #audioNote {
    position: absolute; left: 0; right: 0; bottom: 6%;
    text-align: center; padding: 0 24px;
    color: #9fb3d9; font-size: 15px; letter-spacing: 0.06em; line-height: 1.5;
    font-family: Arial, sans-serif; font-weight: normal;
    animation: pulse 1.6s ease-in-out infinite;
  }
@keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
</style>

    <script>
(function(){

"use strict";
/* ============================================================
   RA TOD boot splash (v2) - Sega style
   1. Tap -> black screen, word hidden.
   2. A beam of light sweeps left to right, visible ONLY on the
      font: letters are revealed one by one where the light hits.
   3. Whole word glowing -> the choir sings "Ray Tod".
   4. Hold, fade, hand off to the game.
   CONFIG: game file to load next. Override with ?next=...
   ============================================================ */

const WORD = "Ra Tod";
const SWEEP_MS   = 1100;   // 2x cut: every stage halved
const REVEAL_GAP = 225;
const VOCAL_MS   = 1880;   // 3-voice sung "RAAAY TODD", 2x baked in (pitch-preserved)
const VOCAL_RATE = 1.0;     // speed is baked into the file; playbackRate would chipmunk it
const HOLD_MS    = 400;
const FADE_MS    = 300;

const stage = document.getElementById("stage");
const prompt = document.getElementById("prompt");
const logoWrap = document.getElementById("logoWrap");
const logoBox = document.getElementById("logoBox");
const logo = document.getElementById("logo");
const shine = document.getElementById("shine");
const floorGlow = document.getElementById("floorGlow");
const vocal = document.getElementById("vocal");

const letters = [];
for (const c of WORD) {
  if (c === " ") {
    const s1 = document.createElement("span"); s1.className = "sp"; logo.appendChild(s1);
    const s2 = document.createElement("span"); s2.className = "sp"; shine.appendChild(s2);
    continue;
  }
  const b = document.createElement("span"); b.className = "ch"; b.textContent = c;
  logo.appendChild(b); letters.push(b);
  const w = document.createElement("span"); w.className = "sch"; w.textContent = c;
  shine.appendChild(w);
}

let splashStarted = false, skipped = false, actx = null;
let vocalBuf = null;

/* decode the vocal into a buffer up front — plays through WebAudio,
   louder and far more reliable on phones than the <audio> element */
function preloadVocal() {
  if (vocalBuf || !actx) return;
  fetch(vocal.src).then(r => r.arrayBuffer())
    .then(ab => actx.decodeAudioData(ab))
    .then(buf => { vocalBuf = buf; window.__vocalReady = true; })
    .catch(e => console.warn("vocal decode failed, element fallback:", e));
}

function choirChord(freqs, when, dur, peak) {
  const t0 = when;
  const master = actx.createGain();
  master.gain.setValueAtTime(0.0001, t0);
  master.gain.exponentialRampToValueAtTime(peak, t0 + 0.22);
  master.gain.setValueAtTime(peak, t0 + dur - 0.35);
  master.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  const lp = actx.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 1500; lp.Q.value = 0.4;
  master.connect(lp); lp.connect(actx.destination);
  for (const f of freqs) {
    for (const det of [-7, 0, 7]) {
      const o = actx.createOscillator();
      o.type = "triangle"; o.frequency.value = f; o.detune.value = det;
      const g = actx.createGain(); g.gain.value = 0.30;
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.1);
    }
    const sub = actx.createOscillator();
    sub.type = "sine"; sub.frequency.value = f / 2;
    const sg = actx.createGain(); sg.gain.value = 0.35;
    sub.connect(sg); sg.connect(master);
    sub.start(t0); sub.stop(t0 + dur + 0.1);
  }
}

function sweepWhoosh(when, dur) {
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(); src.buffer = buf;
  const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.6;
  bp.frequency.setValueAtTime(500, when);
  bp.frequency.exponentialRampToValueAtTime(5200, when + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(0.12, when + dur * 0.45);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  src.connect(bp); bp.connect(g); g.connect(actx.destination);
  src.start(when); src.stop(when + dur + 0.05);
}

/* beam sweep visible only on the letter shapes */
function driveShine() {
  const tStart = performance.now();
  function frame(now) {
    const p = (now - tStart) / SWEEP_MS;
    if (p >= 1) {
      shine.style.webkitMaskImage = "none";
      shine.style.maskImage = "none";
      return;
    }
    const x = -14 + p * 128;
    const g = "linear-gradient(90deg, transparent " + (x - 11) + "%, #000 " + x + "%, transparent " + (x + 11) + "%)";
    shine.style.webkitMaskImage = g;
    shine.style.maskImage = g;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function chant() {
  logoBox.classList.add("chanting");
  if (!actx) return;
  const t0 = actx.currentTime + 0.03;
  const rayChord = [130.81, 164.81, 196.00, 261.63];
  const todChord = [146.83, 185.00, 220.00, 293.66];
  choirChord(rayChord, t0, 0.68, 0.30);
  choirChord(todChord, t0 + 0.65, 0.93, 0.34);
  window.__chantPlayed = true;
  if (vocalBuf) {
    const vsrc = actx.createBufferSource(); vsrc.buffer = vocalBuf;
    vsrc.playbackRate.value = VOCAL_RATE;
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 8;
    const vg = actx.createGain(); vg.gain.value = 1.5;
    vsrc.connect(vg); vg.connect(comp); comp.connect(actx.destination);
    vsrc.start(t0);
  } else {
    vocal.currentTime = 0;
    vocal.playbackRate = VOCAL_RATE;
    const p = vocal.play();
    if (p && p.catch) p.catch((e) => console.warn("vocal play failed:", e));
  }
}

function showNote(text) {
  let note = document.getElementById("audioNote");
  if (!note) {
    note = document.createElement("div");
    note.id = "audioNote";
    stage.appendChild(note);
  }
  note.textContent = text;
}

/* audio setup is isolated: if it throws, the animation still runs */
function initAudio() {
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    actx = null;
  }
  if (!actx) {
    showNote("This preview blocks sound — download the file and open it in Chrome or Edge to hear the RAY TOD chant.");
    return 0;
  }
  if (actx.state === "suspended") actx.resume();
  /* if sound is still blocked a moment after the tap, say so */
  setTimeout(() => {
    if (actx.state !== "running") {
      showNote("Sound is blocked in this preview — download the file and open it in Chrome or Edge to hear the RAY TOD chant.");
    }
  }, 1500);
  preloadVocal();
  return actx.currentTime + 0.05;
}

function start() {
  if (splashStarted) return;
  splashStarted = true;
  try {
    prompt.style.display = "none";
    logoWrap.style.display = "flex";
  } catch (e) {
    showNote("Start failed: " + ((e && e.message) || e));
    return;
  }

  const t0 = initAudio();

  if (t0) sweepWhoosh(t0 + 0.1, SWEEP_MS / 1000);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    try {
      floorGlow.classList.add("on");
      driveShine();
      const per = SWEEP_MS / (letters.length + 1);
      letters.forEach((el, i) => {
        setTimeout(() => el.classList.add("lit"), per * (i + 0.7));
      });
    } catch (e) {
      showNote("Animation failed: " + ((e && e.message) || e));
    }
  }));

  const chantAt = SWEEP_MS + REVEAL_GAP;
  setTimeout(chant, chantAt);

  const total = chantAt + VOCAL_MS + HOLD_MS;
  setTimeout(() => {
    if (!skipped) stage.classList.add("fade");
    setTimeout(() => { if (!skipped) window.__splashDone(); }, FADE_MS + 80);
  }, total);

  setTimeout(() => {
    stage.addEventListener("pointerdown", () => {
      if (!skipped) { skipped = true; window.__splashDone(); }
    });
  }, 700);
}

/* bulletproof tap: pointer, touch, click, and keyboard all start the show */
["pointerdown", "touchend", "click"].forEach(t => stage.addEventListener(t, start, { passive: true }));
window.addEventListener("keydown", start);

})();
    </script>
